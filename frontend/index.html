<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Art : Affiches de film animées</title>
  </head>
  <body>
    <div class="container">
      <h1>Digital Art : Affiches de film animées</h1>
      <div class="app-layout">
        <main id="movies-grid" class="movies-grid"></main>

        <aside id="editor" class="editor hidden" aria-hidden="true">
          <button id="back-button" class="back-btn">← Retour</button>
          <div class="editor-inner">
            <section class="configurator" id="configurator">
              <!-- configurator injected via JS -->
            </section>

            <div class="canvas-wrapper">
              <canvas id="poster-canvas" width="1080" height="1600"></canvas>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
